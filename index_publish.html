<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Adventure Game</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
          sans-serif;
      }
      .GameView {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        overflow-y: scroll;
        position: relative;
      }
      .GameView::-webkit-scrollbar {
        display: none;
      }
      .GameView * {
        width: fit-content;
        height: fit-content;
        word-break: break-all;
        white-space: break-spaces;
      }
      span.npcName {
        color: orange;
        font-weight: bold;
      }
      span.playerName {
        color: green;
        font-weight: bold;
      }
      span.itemName {
        color: green;
      }
      span.equipmentName {
        color: blue;
      }
      span.success {
        color: green;
      }
      span.fail {
        color: red;
      }
      span.placeName {
        color: yellow;
        background: black;
      }
      span.monsterName {
        color: red;
      }
      span.debuffInfo {
        color: black;
        border: 1px solid black;
        font-size: 17px;
      }
      span.buffReason {
        color: yellow;
        font-family: bold;
      }
      span.debuffReason {
        color: red;
        font-weight: bold;
      }
      span.buffInfo {
        color: green;
        border: 1px solid green;
        font-size: 17px;
      }
      button {
        padding: 10px;
        border: none;
        border-radius: 5px;
        box-sizing: content-box;
        font-size: 16px;
        transition: outline 0.3s ease, box-shadow 0.3s ease;
        outline: none;
        box-shadow: 0 0 5px #ccc;
        border: 0px;
        transition: background-color 0.3s ease, color 0.3s ease;
        width: fit-content;
        height: 40px;
        font-size: 16px;
        border-radius: 5px;
        color: black;
        cursor: pointer;
      }
      button:hover {
        background-color: #00abff;
        color: white;
      }
      #location_container {
        width: 100%;
        text-align: center;
        font-weight: bolder;
        font-size: 24px;
        font-family: cursive;
      }
      #BeginningStory {
        width: 100%;
        height: 60%;
        border: solid 2px;
        overflow-y: scroll;
      }
      #player_bag {
        height: calc(calc(100% - 67px) / 3);
        width: 100%;
        top: 67px;
        right: 0px;
        overflow-y: scroll;
        border: 2px solid;
      }
      #player_status {
        height: calc(calc(100vh - 67px) / 3);
        width: 100%;
        top: calc(calc(100vh - 67px) / 3 + 67px);
        right: 0px;
        overflow-y: scroll;
        border: 2px solid;
      }
      #player_equipment {
        height: calc(calc(100vh - 67px) / 3);
        width: 100%;
        top: calc(calc(calc(100vh - 67px) / 3) * 2 + 67px);
        right: 0px;
        overflow-y: scroll;
        border: 2px solid;
      }
      hr {
        width: 100%;
      }
      @media only screen and (min-width: 768px) {
        #player_equipment {
          position: fixed;
          width: 40%;
        }

        #player_status {
          position: fixed;
          width: 40%;
        }

        #player_bag {
          position: fixed;
          width: 40%;
        }
        #BeginningStory {
          height: 100%;
          width: 60%;
        }
      }
      .boxTitle {
        font-size: 18px;
        font-weight: bolder;
        font-family: cursive;
        width: 100%;
      }
      .bag_item {
        width: 100%;
        box-sizing: border-box;
        padding: 3px;
        font-size: 18px;
        user-select: none;
        cursor: pointer;
        border-bottom: 1px dashed gray;
        transition: background-color 0.3s ease;
      }
      .status_item {
        width: 100%;
        box-sizing: border-box;
        padding: 3px;
        font-size: 18px;
        border-bottom: 1px dashed gray;
      }
      .bag_item.nohover {
        cursor: default;
        user-select: contain;
      }
      .bag_item:not(.nohover):hover {
        background-color: #00abff;
      }
      .BeforeStartCover {
        position: absolute;
        height: 100vh;
        width: 100vw;
        display: grid;
        place-items: center;
        background-color: rgba(0, 0, 0, 1);
        transition: background-color 1s ease;
      }
      .BeforeStartCover.fadeOut {
        background-color: rgba(0, 0, 0, 0);
      }
      .BeforeStartTitle {
        color: #eee;
        font-weight: bold;
        font-size: 3em;
        animation-name: fade-in-out;
        animation-duration: 2s;
        animation-timing-function: linear;
        animation-delay: 0s;
        animation-iteration-count: infinite;
        animation-direction: normal;
        animation-fill-mode: none;
        user-select: none;
        /* shorthand
        animation: fade-in 2s linear 0s 1 normal none;*/
      }
      @keyframes fade-in-out {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      span[hasDescription] {
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="GameView"></div>
  </body>
</html>
